<div #map id="map">

</div>

<section class="fixed w-[260px] bg-white rounded top-20 left-20 p-2">
  <h2 class="text-xl font-bold text-black mb-2">Markers</h2>
  <div class="flex flex-col gap-2">
    @for (marker of markers(); track marker.id) {
    <div class="form-control" (click)="flyToMarker(marker.mapboxMarker.getLngLat())" (dblclick)="deleteMarker(marker)">
      <label class="label cursor-pointer">
        <input type="radio" name="radio" checked="checked" class=" radio bg-red-100 border-red-300 checked:bg-red-200"
          [style]="{backgroundColor: marker.mapboxMarker._color}" />
        <span class="label-text text-black text-xs">Latitud: {{ marker.mapboxMarker.getLngLat().lat | number:
          '1.0-4'}}</span>
        <br>
        <span class="label-text text-black text-xs">Longitud:{{ marker.mapboxMarker.getLngLat().lng | number:
          '1.0-4'}}</span>
      </label>
    </div>
    }@empty {
    <div class="flex justify-center items-center bg-blue-100 rounded">
      <p class="text-xs text-secondary">No hay marcadores</p>
    </div>
    }
  </div>
</section>
