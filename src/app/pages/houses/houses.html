<section class="px-2">
  <h2 class="text-3xl font-bold mb-2"></h2>
  <h3 class="text-xl text-gray-500 mb-2">
    {{ 3 }} casas disponibles
  </h3>

</section>

<section class="px-2 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-2">
  @for(house of houses(); track house.id ){
  <div class="card bg-base-100 shadow-sm">
    <minimap [coordinates]="house.lngLat"/>
    <div class="card-body">
      <h2 class="card-title">
        {{ house.name }}
      </h2>
      <p> {{house.description}} </p>
      <div class="card-actions justify-end">
        @for (label of house.tags; track $index) {
        <div class="badge badge-outline">{{label}}</div>

        }
        <div class="badge badge-outline">Products</div>
      </div>
    </div>
  </div>
  }

</section>
